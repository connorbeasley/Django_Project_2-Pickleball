{% extends "tournaments/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
  <h2>Create an account.</h2>
{% endblock page_header %}

{% block content %}

<form action="{% url 'users:register' %}" method='post'>

    {% csrf_token %}

    {% bootstrap_form form %}

    <button name="submit" class="btn btn-primary">Register</button>

</form>

{% endblock content %}
