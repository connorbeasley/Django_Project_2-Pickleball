{% extends 'tournaments/base.html' %}
{% load bootstrap4 %}
{% block content %}
  <p><a href="{% url 'tournaments:tournament' tournament.id %}">{{ tournament }}</a></p>
  <h1 class="h3">Add a division</h1>

  <form action="{% url 'tournaments:new_division' tournament.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-primary">Add division</button>
  </form>
{% endblock content %}
