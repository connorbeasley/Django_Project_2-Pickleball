{% extends 'tournaments/base.html' %}
{% load bootstrap4 %}
{% block content %}
  <p><a href="{% url 'tournaments:division' game.division.id %}">{{ game.division }}</a></p>
  <h1 class="h3">Round {{ game.round_number }}, game {{ game.game_number }}</h1>
  <p>{{ game.a1 }} and {{ game.a2 }} vs {{ game.b1 }} and {{ game.b2 }}</p>
  <form action="{% url 'tournaments:edit_scramble_game' game.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-primary">Save</button>
  </form>
{% endblock content %}
