{% extends 'tournaments/base.html' %}
{% load bootstrap4 %}
{% block content %}
  <p><a href="{% url 'tournaments:index' %}">Home</a></p>
  <h1 class="h3">Create a tournament</h1>

  <form action="{% url 'tournaments:new_tournament' %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-primary">Create tournament</button>
  </form>
{% endblock content %}
